AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS Estimate Builder - API, background worker (Bedrock), headless AWS Pricing Calculator renderer,
  job storage, API throttling and budget alarm.

Parameters:
  CodeBucket:
    Type: String
  BackendKey:
    Type: String
  RendererKey:
    Type: String
  ModelId:
    Type: String
    Default: openai.gpt-oss-120b-1:0
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Browser origin allowed to call the API (the Amplify URL).
  BudgetEmail:
    Type: String
  MonthlyBudgetUsd:
    Type: Number
    Default: 30

Resources:
  JobsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-jobs
            Status: Enabled
            ExpirationInDays: 1

  # ---------- renderer: headless Chromium driving calculator.aws ----------
  RendererRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]

  RendererFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: index.handler
      Role: !GetAtt RendererRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref RendererKey }
      MemorySize: 3008
      Timeout: 300
      EphemeralStorage: { Size: 1024 }

  RendererLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RendererFunction}
      RetentionInDays: 14

  # ---------- worker: file parsing, Bedrock, pricing jobs ----------
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${ModelId}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${JobsBucket.Arn}/jobs/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RendererFunction.Arn

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: handler.worker_handler
      Role: !GetAtt WorkerRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref BackendKey }
      MemorySize: 1024
      Timeout: 600
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          BEDROCK_REGION: !Ref AWS::Region
          JOBS_BUCKET: !Ref JobsBucket
          RENDERER_FUNCTION: !Ref RendererFunction

  WorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WorkerFunction}
      RetentionInDays: 14

  # ---------- API: start jobs, poll jobs, service catalog ----------
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${JobsBucket.Arn}/jobs/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt JobsBucket.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: handler.lambda_handler
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref BackendKey }
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          JOBS_BUCKET: !Ref JobsBucket
          WORKER_FUNCTION: !Ref WorkerFunction
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      EndpointConfiguration: { Types: [REGIONAL] }

  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: "{proxy+}"

  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ProxyMethod
    Properties:
      RestApiId: !Ref Api

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
